name: Deploy to O2Switch

# ──────────────────────────────────────────────────────────────
# Contraintes O2Switch (mêmes que sur Portfy) :
#   - Port 22 (SSH) bloqué depuis les IPs GitHub Actions
#   - Bot protection O2Switch (Imunify360) bloque curl/wget entrants
#
# Architecture retenue :
#   CI  →  build le frontend et commit frontend/dist/ sur main + audit sécurité
#   Serveur → cron cPanel toutes les 5 min qui pull et déploie
#             (voir scripts/server-deploy.sh) — copie ce dist déjà construit,
#             ne lance plus jamais `npm run build` lui-même.
#
# Pourquoi construire ici plutôt que sur le serveur : sur ce compte O2Switch,
# NODE_ENV=production (actif via l'environnement Node du Setup Node.js App) fait sauter les
# devDependencies à l'install quel que soit le flag npm utilisé (--include=dev, --production=false)
# — et vite en fait partie. Plutôt que dépendre d'un comportement npm peu fiable sur cet
# environnement, le frontend est construit une fois ici, dans un environnement standard.
# ──────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]

permissions:
  contents: write   # nécessaire pour committer frontend/dist/ en retour sur main

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sans ça, le commit de dist/ plus bas redéclencherait ce même workflow indéfiniment.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        # Les variables VITE_* sont figées dans le bundle au moment du build — le frontend
        # ne lit plus jamais frontend/.env du serveur (on ne construit plus là-bas, voir
        # plus haut). Sans ça, le bundle prod garde les valeurs de repli codées en dur
        # (ex. http://localhost:3002/api), inutilisables pour un vrai visiteur.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: npm ci && npm run build

      # Committer AVANT l'audit, pas après : le déploiement (construire + publier le build) est
      # le chemin critique, l'audit est une vérification informative à côté. Un pépin de
      # tooling ou de registre sur l'audit (voir plus bas) ne doit jamais empêcher un correctif
      # d'atteindre la prod.
      - name: Committer le build sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist
          if git diff --cached --quiet; then
            echo "dist/ inchangé — rien à committer."
          else
            git commit -m "build: frontend/dist [skip ci]"
            git push
          fi

      # continue-on-error : le point de terminaison d'audit "quick" de npm (utilisé par les
      # versions de npm embarquées avec Node 20 sur ce runner) est en cours de dépréciation
      # côté registre npm et répond parfois 400 sans rapport avec un vrai souci de sécurité —
      # l'étape reste visible (⚠️) si elle échoue, sans jamais bloquer le déploiement.
      - name: Audit sécurité frontend
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Audit sécurité backend
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Vérifier que le serveur répond
        run: |
          echo "Le déploiement backend est géré par le cron côté serveur (scripts/server-deploy.sh)."
          echo "Ce step vérifie uniquement que le serveur est en ligne."
          status=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ vars.HEALTH_CHECK_URL }}/api/health" || echo "000")
          echo "Health check: HTTP $status"
          if [ "$status" = "200" ]; then
            echo "Serveur opérationnel."
          else
            echo "WARN: Le serveur ne répond pas (HTTP $status) — vérifier le cron."
          fi
